services:
  # PostgreSQL database for both Dendrite and Synapse
  postgres:
    image: postgres:17
    container_name: den2syn-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
      - ./dendrite-dumps:/dendrite-dumps:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service to initialize Synapse database schema
  synapse-schema-init:
    image: matrixdotorg/synapse:v1.163.0
    container_name: den2syn-synapse-init
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - synapse_data:/data
      # scripts/synapse_dev_config.py, shared with the dev loop.
      - ../scripts:/den2syn-scripts:ro
    entrypoint: []
    command:
      - sh
      - -ec
      - |
        echo 'Generating Synapse config...'
        python /den2syn-scripts/synapse_dev_config.py \
          --server-name=${SERVER_NAME:-test.local} \
          --db-host=postgres --db-user=matrix --db-password=matrix_password \
          --log-to-console
        echo 'Initializing Synapse database schema...'
        update_synapse_database --database-config /data/homeserver.yaml
        echo 'Synapse database schema initialized successfully!'

  # Service to run den2syn migration
  den2syn-migration:
    build:
      context: ..
      dockerfile: integration-test/Dockerfile.den2syn
    container_name: den2syn-migration
    depends_on:
      postgres:
        condition: service_healthy
      synapse-schema-init:
        condition: service_completed_successfully
    environment:
      - SERVER_NAME=${SERVER_NAME:-test.local}
      - DENDRITE_DB_URL=postgres://matrix:matrix_password@postgres:5432/dendrite?sslmode=disable
      - SYNAPSE_DB_URL=postgres://matrix:matrix_password@postgres:5432/synapse?sslmode=disable
    command: ["postgres", "5432", "--", "./run-migration.sh"]
    volumes:
      - ./scripts:/scripts:ro
      - migration_logs:/logs
      # The homeserver.yaml generated by synapse-schema-init.
      - synapse_data:/data
      # Dendrite's media_api.base_path, copied next to the dumps.
      - ./dendrite-dumps/media:/dendrite-media:ro

  # Synapse for validation
  synapse:
    image: matrixdotorg/synapse:v1.163.0
    container_name: den2syn-synapse
    volumes:
      - synapse_data:/data
      # scripts/synapse_dev_config.py, shared with the dev loop.
      - ../scripts:/den2syn-scripts:ro
    ports:
      - "8008:8008"
    entrypoint: []
    command:
      - sh
      - -ec
      - |
        if ! grep -q Access-Control-Allow-Private-Network /usr/local/lib/python3.13/site-packages/synapse/http/server.py; then
          echo 'Patching Access-Control-Allow-Private-Network...'
          sed -i 's|request.setHeader(b"Access-Control-Allow-Origin", b"\*")|\0\n    request.setHeader(b"Access-Control-Allow-Private-Network", b"true")|' /usr/local/lib/python3.13/site-packages/synapse/http/server.py
        fi
        echo 'Patching Synapse config...'
        python /den2syn-scripts/synapse_dev_config.py \
          --server-name=${SERVER_NAME:-test.local} \
          --db-host=postgres --db-user=matrix --db-password=matrix_password \
          --public-baseurl=http://localhost:8008/ \
          --log-to-console --log-level=DEBUG
        echo 'Updating Synapse database schema...'
        update_synapse_database --database-config /data/homeserver.yaml --run-background-updates
        echo 'Starting Synapse validation...'
        python -m synapse.app.homeserver -c /data/homeserver.yaml
    healthcheck:
      test: ["CMD-SHELL", "curl -sS http://localhost:8008/_matrix/static/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Test runner service
  integration-test:
    # The den2syn image has the client test and its dependencies.
    build:
      context: ..
      dockerfile: integration-test/Dockerfile.den2syn
    container_name: den2syn-test
    depends_on:
      synapse:
        condition: service_healthy
    environment:
      # Optional, e.g. RECOVERY_KEY_alice, to also decrypt that user's key
      # backup. Only passed through from the environment.
      - RECOVERY_KEY_${RECOVERY_KEY_USER:-unset}
      # Optional, e.g. PASSWORD_alice, to also test password login.
      - PASSWORD_${PASSWORD_USER:-unset}
    volumes:
      - ./dendrite-dumps/media:/dendrite-media:ro
      - test_results:/test-results
    command: ["postgres", "5432", "--", "./run-integration-tests.sh"]

volumes:
  postgres_data:
  migration_logs:
  synapse_data:
  test_results:
